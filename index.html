<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wyoming Gear Packing List Generator v3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            color: #ff6b35;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-section {
            background: #2a2a2a;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ff6b35;
            font-weight: 500;
            font-size: 14px;
        }

        select, input[type="number"], input[type="text"], input[type="date"] {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #ff6b35;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"], input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
            color: #e0e0e0;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #e55a2b;
        }

        button:active {
            transform: scale(0.98);
        }

        #output {
            display: none;
        }

        #output.show {
            display: block;
        }

        .output-header {
            background: #2a2a2a;
            padding: 20px 25px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .output-header h2 {
            color: #ff6b35;
            font-size: 24px;
        }

        .btn-secondary {
            padding: 8px 16px;
            background: #444;
            color: #e0e0e0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background: #555;
        }

        .trip-summary {
            background: #2a2a2a;
            padding: 20px 25px;
            font-size: 14px;
            border-bottom: 2px solid #ff6b35;
        }

        .trip-summary strong {
            color: #ff6b35;
        }

        .gear-section {
            background: #2a2a2a;
            padding: 25px;
        }

        .gear-section:last-child {
            border-radius: 0 0 8px 8px;
        }

        .priority-category {
            margin-bottom: 30px;
        }

        .priority-category:last-child {
            margin-bottom: 0;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #444;
        }

        .category-header h3 {
            color: #ff6b35;
            font-size: 20px;
            margin: 0;
        }

        .category-count {
            color: #888;
            font-size: 14px;
        }

        .system-group {
            margin-bottom: 20px;
        }

        .system-group:last-child {
            margin-bottom: 0;
        }

        .system-name {
            color: #aaa;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .gear-list {
            list-style: none;
        }

        .gear-item {
            padding: 8px 0;
            padding-left: 30px;
            position: relative;
            font-size: 15px;
        }

        .gear-item.critical:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
        }

        .gear-item.option,
        .gear-item.nice,
        .gear-item.available {
            cursor: pointer;
            transition: background 0.2s;
        }

        .gear-item.option:hover,
        .gear-item.nice:hover,
        .gear-item.available:hover {
            background: rgba(255, 107, 53, 0.1);
            border-radius: 4px;
            margin-left: -5px;
            padding-left: 35px;
        }

        .gear-item.option:before,
        .gear-item.nice:before,
        .gear-item.available:before {
            content: "☐";
            position: absolute;
            left: 0;
            color: #ff6b35;
            font-size: 18px;
            transition: all 0.2s;
        }

        .gear-item.selected:before {
            content: "☑";
            color: #4CAF50;
        }

        .gear-item.selected {
            color: #4CAF50;
        }

        .dependency {
            color: #888;
            font-size: 13px;
            margin-left: 10px;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
            background: #2a2a2a;
            border-radius: 8px;
        }

        .stats {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .stats strong {
            color: #ff6b35;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .action-buttons button {
            flex: 1;
            padding: 12px;
            font-size: 15px;
        }

        .btn-final {
            background: #4CAF50;
        }

        .btn-final:hover {
            background: #45a049;
        }

        .btn-clear {
            background: #666;
        }

        .btn-clear:hover {
            background: #777;
        }

        /* --- New styles for persistent packing view --- */

        .continue-box {
            background: #2a2a2a;
            border: 2px solid #ff6b35;
            padding: 20px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .continue-box h3 {
            color: #ff6b35;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .continue-box select {
            margin-bottom: 12px;
        }

        .sync-status {
            font-size: 13px;
            color: #888;
            margin-top: 10px;
            min-height: 18px;
        }

        .sync-status.ok {
            color: #4CAF50;
        }

        .sync-status.error {
            color: #e55a2b;
        }

        .pack-list {
            list-style: none;
        }

        .pack-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }

        .pack-item:last-child {
            border-bottom: none;
        }

        .pack-item input[type="checkbox"] {
            flex-shrink: 0;
        }

        .pack-item .item-name {
            flex: 1;
            font-size: 15px;
        }

        .pack-item.is-packed .item-name {
            color: #4CAF50;
            text-decoration: line-through;
        }

        .pack-item select {
            width: 180px;
            flex-shrink: 0;
            padding: 6px;
            font-size: 13px;
        }

        .progress-bar-outer {
            background: #1a1a1a;
            border-radius: 4px;
            height: 10px;
            overflow: hidden;
            margin: 15px 0 20px 0;
        }

        .progress-bar-inner {
            background: #4CAF50;
            height: 100%;
            transition: width 0.3s;
        }

        #finalList {
            background: #2a2a2a;
            padding: 25px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        #finalList.show {
            display: block;
        }

        #finalList h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wyoming Gear Packing List Generator</h1>
        <p class="subtitle">CSV-driven packing list with smart filtering + trip tracking</p>
        <p id="dataStatus" style="font-size:13px; margin-bottom:15px; color:#888;">Loading gear data...</p>
        <p id="appStateStatus" style="font-size:13px; margin-bottom:15px; color:#888;">Connecting to trip tracker...</p>

        <div id="continueBox"></div>

        <div class="form-section" id="intakeSection">
            <form id="tripForm">
                <div class="form-group">
                    <label for="tripName">Trip Name</label>
                    <input type="text" id="tripName" placeholder="e.g. Bighorns Bikepacking" required>
                </div>

                <div class="form-group">
                    <label for="tripDate">Trip Date</label>
                    <input type="date" id="tripDate" required>
                </div>

                <div class="form-group">
                    <label for="activity">Activity Type</label>
                    <select id="activity" required>
                        <option value="">Select activity...</option>
                        <option value="elk">Elk Hunting</option>
                        <option value="deer">Deer Hunting (Black Hills)</option>
                        <option value="antelope">Antelope Hunting</option>
                        <option value="turkey">Turkey Hunting</option>
                        <option value="small_game">Small Game</option>
                        <option value="bikepacking">Bikepacking</option>
                        <option value="ebike_bikepacking">E-Bike Bikepacking</option>
                        <option value="camping">Camping</option>
                        <option value="scouting">Scouting</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="baseType">Base Type</label>
                    <select id="baseType" required>
                        <option value="">Select base type...</option>
                        <option value="cabin">Cabin</option>
                        <option value="camper">Camper</option>
                        <option value="tent">Vehicle + Tent</option>
                        <option value="backcountry">Backcountry (No Vehicle)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Temperature Range (Select all that apply)</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="temp_above_60" value="above_60F">
                            <label for="temp_above_60">Above 60°F</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="temp_40_to_60" value="40_to_60F">
                            <label for="temp_40_to_60">40-60°F</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="temp_20_to_40" value="20_to_40F" checked>
                            <label for="temp_20_to_40">20-40°F</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="temp_below_20" value="below_20F">
                            <label for="temp_below_20">Below 20°F</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="duration">Trip Duration (days)</label>
                    <input type="number" id="duration" min="1" max="30" value="3" required>
                </div>

                <div class="form-group">
                    <label>Mobility</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="radio" name="mobility" id="mob_foot" value="foot" checked>
                            <label for="mob_foot">On Foot</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="radio" name="mobility" id="mob_bike" value="bike">
                            <label for="mob_bike">Bike (Trek Farley)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="radio" name="mobility" id="mob_ebike" value="ebike">
                            <label for="mob_ebike">E-Bike (UltraBeast)</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Conditions</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="cond_snow" value="snow">
                            <label for="cond_snow">Snow</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="cond_wet" value="wet">
                            <label for="cond_wet">Wet/Rain</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="cond_wind" value="wind">
                            <label for="cond_wind">Strong Wind</label>
                        </div>
                    </div>
                </div>

                <button type="submit">Generate Packing List</button>
            </form>
        </div>

        <div id="output"></div>
        <div id="finalList"></div>
    </div>

    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRo_0r0lmyUU-xzfQiRS8Rzf1f4tpApyi8R9nX5qi6HE2Icc6uw1JWgZZY0UH59EFncFnsP6gjOEH5e/pub?gid=524249775&single=true&output=csv';
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbziYtUUQSJ5Nj1j7xCsMpRS74KKwZfOAEIRTIKFmdXSVvO_Vc5OLRoCvmrR60YXxig_FQ/exec';

        let gearDatabase = [];
        let dataLoaded = false;

        let containers = [];
        let inProgressTrips = [];
        let completedTrips = [];
        let currentTripId = null;
        let currentItems = [];   // [{name, packed, container}]
        let lastFormData = null; // stashed so we can send activity/base/etc to create_trip

        // Maps form activity values to exact CSV column names
        const ACTIVITY_COL_MAP = {
            'elk':              'Act_elk_hunting',
            'deer':             'Act_deer_hunting',
            'antelope':         'Act_antelope_hunting',
            'turkey':           'Act_turkey_hunting',
            'small_game':       'Act_small_game',
            'bikepacking':      'Act_bikepacking',
            'ebike_bikepacking':'Act_ebike_bikepacking',
            'camping':          'Act_camping',
            'scouting':         'Act_scouting'
        };

        // Maps mobility selection to exact item_name in CSV
        const MOBILITY_ITEM_MAP = {
            'bike':  'Trek Farley',
            'ebike': 'Ultra Beast Ebike'
        };

        function parseCSV(csvText) {
            const lines = csvText.split('\n');
            const headers = lines[0].split(',').map(h => h.trim().replace(/\r/g, ''));
            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const values = [];
                let inQuote = false;
                let current = '';
                for (let c = 0; c < line.length; c++) {
                    if (line[c] === '"') {
                        inQuote = !inQuote;
                    } else if (line[c] === ',' && !inQuote) {
                        values.push(current.trim());
                        current = '';
                    } else {
                        current += line[c];
                    }
                }
                values.push(current.trim());
                const row = {};
                headers.forEach((h, idx) => {
                    row[h] = (values[idx] || '').replace(/\r/g, '');
                });
                rows.push(row);
            }
            return rows;
        }

        async function loadGearData() {
            const statusEl = document.getElementById('dataStatus');
            try {
                statusEl.textContent = 'Loading gear data from Google Sheets...';
                statusEl.style.color = '#888';
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const csvText = await response.text();
                gearDatabase = parseCSV(csvText);
                dataLoaded = true;
                statusEl.textContent = `✓ ${gearDatabase.length} gear items loaded`;
                statusEl.style.color = '#4CAF50';
            } catch (err) {
                statusEl.textContent = '✗ Could not load gear data. Check your internet connection or Sheet publish settings.';
                statusEl.style.color = '#e55a2b';
                console.error('Gear data load error:', err);
            }
        }

        async function loadAppState() {
            const statusEl = document.getElementById('appStateStatus');
            try {
                statusEl.textContent = 'Connecting to trip tracker...';
                statusEl.style.color = '#888';
                const res = await fetch(APPS_SCRIPT_URL);
                if (!res.ok) throw new Error('Bad response');
                const data = await res.json();
                containers = data.containers || [];
                inProgressTrips = data.trips || [];
                completedTrips = data.completedTrips || [];
                statusEl.textContent = `✓ Trip tracker connected (${containers.length} containers, ${inProgressTrips.length} trip(s) in progress)`;
                statusEl.style.color = '#4CAF50';
                renderContinueBox();
            } catch (err) {
                statusEl.textContent = '✗ Could not reach trip tracker. You can still generate a list, but packing progress won\'t save.';
                statusEl.style.color = '#e55a2b';
                console.error('App state load error:', err);
            }
        }

        loadGearData();
        loadAppState();

        function renderContinueBox() {
            const box = document.getElementById('continueBox');
            let html = '';

            if (inProgressTrips.length) {
                let optionsHtml = inProgressTrips.map(t =>
                    `<option value="${t.trip_id}">${t.trip_name} — ${t.trip_date || 'no date'}</option>`
                ).join('');
                html += `
                    <div class="continue-box">
                        <h3>Continue an in-progress trip?</h3>
                        <select id="continueSelect">${optionsHtml}</select>
                        <button type="button" onclick="resumeTrip()">Resume Packing</button>
                    </div>
                `;
            }

            if (completedTrips.length) {
                let rows = completedTrips.map(t => `
                    <div class="pack-item">
                        <span class="item-name">${t.trip_name} — ${t.trip_date || 'no date'}</span>
                        <button type="button" class="btn-secondary" style="width:auto; padding:6px 12px;" onclick="viewCompletedTrip('${t.trip_id}')">View</button>
                        <button type="button" class="btn-secondary" style="width:auto; padding:6px 12px; background:#a33;" onclick="deleteTrip('${t.trip_id}')">Delete</button>
                    </div>
                `).join('');
                html += `
                    <div class="continue-box">
                        <h3>Completed Trips (reference)</h3>
                        <ul class="pack-list" style="list-style:none;">${rows}</ul>
                    </div>
                `;
            }

            box.innerHTML = html;
        }

        function viewCompletedTrip(tripId) {
            const trip = completedTrips.find(t => String(t.trip_id) === String(tripId));
            if (!trip) return;
            let items;
            try {
                items = JSON.parse(trip.items_json);
            } catch (e) {
                alert('Could not read this trip\'s saved item list — the data may be corrupted.');
                return;
            }
            currentTripId = trip.trip_id;
            currentItems = items;
            document.getElementById('intakeSection').style.display = 'none';
            document.getElementById('output').classList.remove('show');
            document.getElementById('output').innerHTML = '';
            renderPersistentPackingView(trip.trip_name, trip.trip_date, true);
        }

        function deleteTrip(tripId) {
            if (!confirm('Delete this trip permanently? This cannot be undone.')) return;
            fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_trip', trip_id: tripId }) })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        inProgressTrips = inProgressTrips.filter(t => String(t.trip_id) !== String(tripId));
                        completedTrips = completedTrips.filter(t => String(t.trip_id) !== String(tripId));
                        renderContinueBox();
                        if (String(currentTripId) === String(tripId)) {
                            currentTripId = null;
                            document.getElementById('finalList').classList.remove('show');
                            document.getElementById('finalList').innerHTML = '';
                            document.getElementById('intakeSection').style.display = '';
                        }
                    } else {
                        alert('Could not delete: ' + (data.error || 'unknown error'));
                    }
                })
                .catch(err => alert('Could not reach trip tracker to delete this trip. Check your connection and try again.'));
        }

        function resumeTrip() {
            const tripId = document.getElementById('continueSelect').value;
            const trip = inProgressTrips.find(t => String(t.trip_id) === String(tripId));
            if (!trip) return;
            let items;
            try {
                items = JSON.parse(trip.items_json);
            } catch (e) {
                alert('Could not read this trip\'s saved item list — the data may be corrupted.');
                return;
            }
            currentTripId = trip.trip_id;
            currentItems = items;
            document.getElementById('intakeSection').style.display = 'none';
            document.getElementById('output').classList.remove('show');
            document.getElementById('output').innerHTML = '';
            renderPersistentPackingView(trip.trip_name, trip.trip_date);
        }

        document.getElementById('tripForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!dataLoaded) {
                alert('Gear data is still loading. Please wait a moment and try again.');
                return;
            }

            const temps = [];
            if (document.getElementById('temp_above_60').checked) temps.push('above_60F');
            if (document.getElementById('temp_40_to_60').checked) temps.push('40_to_60F');
            if (document.getElementById('temp_20_to_40').checked) temps.push('20_to_40F');
            if (document.getElementById('temp_below_20').checked) temps.push('below_20F');

            const formData = {
                tripName: document.getElementById('tripName').value || 'Untitled Trip',
                tripDate: document.getElementById('tripDate').value || '',
                activity: document.getElementById('activity').value,
                baseType: document.getElementById('baseType').value,
                temperatures: temps,
                duration: parseInt(document.getElementById('duration').value),
                mobility: document.querySelector('input[name="mobility"]:checked').value,
                conditions: {
                    snow: document.getElementById('cond_snow').checked,
                    wet: document.getElementById('cond_wet').checked,
                    wind: document.getElementById('cond_wind').checked
                }
            };

            lastFormData = formData;
            generatePackingList(formData);
        });

        function generatePackingList(formData) {
            const output = document.getElementById('output');
            output.innerHTML = '<div class="loading">Generating your packing list...</div>';
            output.classList.add('show');

            setTimeout(() => {
                const result = filterAndCategorize(formData);
                displayPackingList(formData, result);
            }, 300);
        }

        function parseGearCode(code, tripDays) {
            if (!code || code === '') return null;

            if (code.includes('/')) {
                const match = code.match(/^([CONX])(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
                if (match) {
                    const priority = match[1];
                    const baseQty = parseFloat(match[2]);
                    const period = parseFloat(match[3]);
                    const quantity = Math.ceil(tripDays / period) * baseQty;
                    return { priority, quantity };
                }
            }

            if (['C', 'O', 'N', 'X'].includes(code)) {
                return { priority: code, quantity: 1 };
            }

            return null;
        }

        function filterAndCategorize(formData) {
            const activityCol = ACTIVITY_COL_MAP[formData.activity];
            const modeCol = `Mode_${formData.baseType}`;

            const forcedBikeName = MOBILITY_ITEM_MAP[formData.mobility] || null;

            let filtered = gearDatabase.filter(item => {
                if (forcedBikeName && item.item_name === forcedBikeName) return true;

                const parsed = parseGearCode(item[activityCol], formData.duration);
                if (!parsed) return false;

                const modeValue = item[modeCol];
                if (modeValue && modeValue === 'X') return false;

                if (formData.temperatures.length > 0) {
                    const hasTempRestriction = item.Temp_below_20F || item.Temp_20_to_40F ||
                                              item.Temp_40_to_60F || item.Temp_above_60F;
                    if (hasTempRestriction) {
                        const matchesTemp = formData.temperatures.some(t => item[`Temp_${t}`]);
                        if (!matchesTemp) return false;
                    }
                }

                return true;
            });

            const critical = [];
            const options = [];
            const nice = [];
            const available = [];

            filtered.forEach(item => {
                const isForcedBike = forcedBikeName && item.item_name === forcedBikeName;
                const parsed = isForcedBike
                    ? { priority: 'C', quantity: 1 }
                    : parseGearCode(item[activityCol], formData.duration);

                if (!parsed) return;

                const itemData = {
                    name: item.item_name,
                    quantity: parsed.quantity,
                    system: getSystem(item),
                    requires: [item.required_item_1, item.required_item_2, item.required_item_3, item.required_item_4].filter(Boolean),
                    rawItem: item
                };

                if (parsed.priority === 'C') critical.push(itemData);
                else if (parsed.priority === 'O') options.push(itemData);
                else if (parsed.priority === 'N') nice.push(itemData);
                else if (parsed.priority === 'X') available.push(itemData);
            });

            const allCritical = [...critical];
            critical.forEach(item => {
                item.requires.forEach(reqName => {
                    if (!allCritical.find(i => i.name === reqName)) {
                        const reqItem = gearDatabase.find(i => i.item_name === reqName);
                        if (reqItem) {
                            allCritical.push({
                                name: reqItem.item_name,
                                system: getSystem(reqItem),
                                requires: [],
                                rawItem: reqItem,
                                autoAdded: true
                            });
                        }
                    }
                });
            });

            return {
                critical: groupBySystem(allCritical),
                options: groupBySystem(options),
                nice: groupBySystem(nice),
                available: groupBySystem(available)
            };
        }

        function getSystem(item) {
            for (let key in item) {
                if (key.startsWith('Sys_') && item[key]) {
                    return key.replace('Sys_', '').replace(/_/g, ' ');
                }
            }
            return 'Other';
        }

        function groupBySystem(items) {
            const groups = {};
            items.forEach(item => {
                const sys = item.system;
                if (!groups[sys]) groups[sys] = [];
                groups[sys].push(item);
            });
            return groups;
        }

        function displayPackingList(formData, result) {
            const activityNames = {
                'deer': 'Deer Hunting',
                'elk': 'Elk Hunting',
                'antelope': 'Antelope Hunting',
                'turkey': 'Turkey Hunting',
                'small_game': 'Small Game',
                'bikepacking': 'Bikepacking',
                'ebike_bikepacking': 'E-Bike Bikepacking',
                'camping': 'Camping',
                'scouting': 'Scouting'
            };

            const baseNames = {
                'cabin': 'Cabin',
                'camper': 'Camper',
                'tent': 'Vehicle + Tent',
                'backcountry': 'Backcountry'
            };

            const mobilityNames = {
                'foot': 'On Foot',
                'bike': 'Bike (Trek Farley)',
                'ebike': 'E-Bike (UltraBeast)'
            };

            const tempDisplay = formData.temperatures.map(t => {
                if (t === 'below_20F') return 'Below 20°F';
                if (t === '20_to_40F') return '20-40°F';
                if (t === '40_to_60F') return '40-60°F';
                if (t === 'above_60F') return 'Above 60°F';
            }).join(', ') || 'All temps';

            let html = `
                <div class="output-header">
                    <h2>${formData.tripName}</h2>
                    <button class="btn-secondary" onclick="window.print()">Print</button>
                </div>

                <div class="trip-summary">
                    <strong>Date:</strong> ${formData.tripDate || 'n/a'}<br>
                    <strong>Activity:</strong> ${activityNames[formData.activity]}<br>
                    <strong>Base:</strong> ${baseNames[formData.baseType]}<br>
                    <strong>Temperature:</strong> ${tempDisplay}<br>
                    <strong>Duration:</strong> ${formData.duration} days<br>
                    <strong>Mobility:</strong> ${mobilityNames[formData.mobility]}
                </div>

                <div class="gear-section">
            `;

            let totalItems = 0;

            html += renderPrioritySection('🔴 CRITICAL (Auto-packed)', result.critical, 'critical');
            totalItems += countItems(result.critical);

            html += renderPrioritySection('🔵 OPTIONS (Choose one or more)', result.options, 'option');
            totalItems += countItems(result.options);

            html += renderPrioritySection('📦 NICE TO HAVE', result.nice, 'nice');
            totalItems += countItems(result.nice);

            html += renderPrioritySection('💡 AVAILABLE (If needed)', result.available, 'available');
            totalItems += countItems(result.available);

            html += `
                </div>
                <div class="stats">
                    <strong>Total Items:</strong> ${totalItems}
                </div>
                <div class="action-buttons">
                    <button class="btn-final" onclick="finalizeAndCreateTrip()">Show Final List &amp; Start Packing</button>
                    <button class="btn-clear" onclick="clearSelections()">Clear Selections</button>
                </div>
            `;

            document.getElementById('output').innerHTML = html;
        }

        function renderPrioritySection(title, groups, cssClass) {
            const itemCount = countItems(groups);
            if (itemCount === 0) return '';

            let html = `
                <div class="priority-category">
                    <div class="category-header">
                        <h3>${title}</h3>
                        <span class="category-count">(${itemCount} items)</span>
                    </div>
            `;

            for (let [system, items] of Object.entries(groups)) {
                if (items.length > 0) {
                    html += `
                        <div class="system-group">
                            <div class="system-name">${system}</div>
                            <ul class="gear-list">
                    `;

                    items.forEach((item, idx) => {
                        const itemId = `${cssClass}_${system.replace(/\s/g, '_')}_${idx}`;
                        const clickable = cssClass !== 'critical' ? `onclick="toggleItem('${itemId}')"` : '';
                        const qtyDisplay = item.quantity > 1 ? ` (${item.quantity})` : '';
                        html += `<li class="gear-item ${cssClass}" id="${itemId}" ${clickable} data-name="${item.name}${qtyDisplay}">`;
                        html += item.name + qtyDisplay;
                        if (item.requires.length > 0) {
                            html += `<span class="dependency">→ requires: ${item.requires.join(', ')}</span>`;
                        }
                        html += `</li>`;
                    });

                    html += `
                            </ul>
                        </div>
                    `;
                }
            }

            html += `</div>`;
            return html;
        }

        function toggleItem(itemId) {
            const element = document.getElementById(itemId);
            element.classList.toggle('selected');
        }

        function clearSelections() {
            document.querySelectorAll('.gear-item.selected').forEach(item => {
                item.classList.remove('selected');
            });
        }

        function countItems(groups) {
            let count = 0;
            for (let items of Object.values(groups)) {
                count += items.length;
            }
            return count;
        }

        // ---- Persistent packing view (trip tracker) ----

        function finalizeAndCreateTrip() {
            const critical = document.querySelectorAll('.gear-item.critical');
            const selected = document.querySelectorAll('.gear-item.selected');

            const items = [];
            critical.forEach(el => items.push({ name: el.getAttribute('data-name'), packed: false, container: '' }));
            selected.forEach(el => items.push({ name: el.getAttribute('data-name'), packed: false, container: '' }));

            if (!lastFormData) return;

            const payload = {
                action: 'create_trip',
                trip_name: lastFormData.tripName,
                trip_date: lastFormData.tripDate,
                activity: lastFormData.activity,
                base_type: lastFormData.baseType,
                temperatures: lastFormData.temperatures.join(','),
                duration: lastFormData.duration,
                mobility: lastFormData.mobility,
                conditions: JSON.stringify(lastFormData.conditions),
                items_json: JSON.stringify(items)
            };

            currentItems = items;

            fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        currentTripId = data.trip_id;
                        document.getElementById('intakeSection').style.display = 'none';
                        document.getElementById('output').classList.remove('show');
                        document.getElementById('output').innerHTML = '';
                        renderPersistentPackingView(lastFormData.tripName, lastFormData.tripDate);
                    } else {
                        currentTripId = null;
                        renderPersistentPackingView(lastFormData.tripName, lastFormData.tripDate);
                        setSyncStatus('⚠ Trip could not be saved to your tracker sheet (' + (data.error || 'unknown error') + '). This list works locally but won\'t persist if you close the page.', 'error');
                    }
                })
                .catch(err => {
                    currentTripId = null;
                    document.getElementById('intakeSection').style.display = 'none';
                    document.getElementById('output').classList.remove('show');
                    document.getElementById('output').innerHTML = '';
                    renderPersistentPackingView(lastFormData.tripName, lastFormData.tripDate);
                    setSyncStatus('⚠ Could not reach your trip tracker sheet. This list works locally but won\'t persist if you close the page.', 'error');
                });
        }

        function containerOptionsHtml(selectedName) {
            let opts = `<option value="">-- container --</option>`;
            containers.forEach(c => {
                const sel = c.container_name === selectedName ? 'selected' : '';
                opts += `<option value="${c.container_name}" ${sel}>${c.container_name}</option>`;
            });
            return opts;
        }

        function renderPersistentPackingView(tripName, tripDate, readOnly) {
            const packedCount = currentItems.filter(i => i.packed).length;
            const total = currentItems.length;
            const pct = total > 0 ? Math.round((packedCount / total) * 100) : 0;

            let itemsHtml = currentItems.map((item, idx) => `
                <li class="pack-item ${item.packed ? 'is-packed' : ''}" data-idx="${idx}">
                    <input type="checkbox" ${item.packed ? 'checked' : ''} ${readOnly ? 'disabled' : `onchange="updatePackedStatus(${idx}, this.checked)"`}>
                    <span class="item-name">${item.name}</span>
                    ${readOnly
                        ? `<span class="item-name" style="flex:0 0 180px; color:#888;">${item.container || '(no container set)'}</span>`
                        : `<select onchange="updateContainer(${idx}, this.value)">${containerOptionsHtml(item.container)}</select>`
                    }
                </li>
            `).join('');

            const actionButtons = readOnly
                ? `
                    <div class="action-buttons" style="margin-top:20px;">
                        <button class="btn-secondary" style="background:#a33;" onclick="deleteTrip('${currentTripId}')">Delete Trip</button>
                        <button class="btn-secondary" onclick="window.print()">Print</button>
                    </div>
                `
                : `
                    <div class="action-buttons" style="margin-top:20px;">
                        <button class="btn-final" onclick="markTripComplete()">Mark Trip Complete</button>
                        <button class="btn-secondary" style="background:#a33;" onclick="deleteTrip('${currentTripId}')">Delete Trip</button>
                        <button class="btn-secondary" onclick="window.print()">Print</button>
                    </div>
                `;

            const html = `
                <h3>${tripName} ${tripDate ? '— ' + tripDate : ''} ${readOnly ? '<span style="color:#888; font-size:14px;">(completed — read only)</span>' : ''}</h3>
                <div class="progress-bar-outer">
                    <div class="progress-bar-inner" style="width:${pct}%"></div>
                </div>
                <div class="stats" style="margin-bottom:20px;"><strong>${packedCount} of ${total}</strong> items packed</div>
                <ul class="pack-list" id="packList">
                    ${itemsHtml}
                </ul>
                ${actionButtons}
                <div class="sync-status" id="syncStatus"></div>
            `;

            const finalListEl = document.getElementById('finalList');
            finalListEl.innerHTML = html;
            finalListEl.classList.add('show');
            finalListEl.scrollIntoView({ behavior: 'smooth' });
        }

        function refreshProgressDisplay() {
            const packedCount = currentItems.filter(i => i.packed).length;
            const total = currentItems.length;
            const pct = total > 0 ? Math.round((packedCount / total) * 100) : 0;
            const bar = document.querySelector('.progress-bar-inner');
            if (bar) bar.style.width = pct + '%';
            const statsEls = document.querySelectorAll('#finalList .stats');
            if (statsEls.length) statsEls[0].innerHTML = `<strong>${packedCount} of ${total}</strong> items packed`;
        }

        function updatePackedStatus(idx, checked) {
            currentItems[idx].packed = checked;
            const li = document.querySelector(`#packList .pack-item[data-idx="${idx}"]`);
            if (li) li.classList.toggle('is-packed', checked);
            refreshProgressDisplay();
            syncTripToServer();
        }

        function updateContainer(idx, value) {
            currentItems[idx].container = value;
            syncTripToServer();
        }

        function setSyncStatus(msg, kind) {
            const el = document.getElementById('syncStatus');
            if (!el) return;
            el.textContent = msg;
            el.className = 'sync-status' + (kind ? ' ' + kind : '');
        }

        function syncTripToServer(status) {
            if (!currentTripId) {
                setSyncStatus('⚠ Not connected to trip tracker — changes are only kept on this page until it saves.', 'error');
                return;
            }
            setSyncStatus('Saving...', '');
            const payload = {
                action: 'update_trip',
                trip_id: currentTripId,
                items_json: JSON.stringify(currentItems),
                status: status || 'in_progress'
            };
            fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        setSyncStatus('✓ Saved', 'ok');
                    } else {
                        setSyncStatus('⚠ Save failed: ' + (data.error || 'unknown error'), 'error');
                    }
                })
                .catch(err => {
                    setSyncStatus('⚠ Could not reach trip tracker — check connection. This change is not saved yet.', 'error');
                });
        }

        function markTripComplete() {
            if (!confirm('Mark this trip as complete? It will move to your Completed Trips reference list and stop showing under Continue Packing.')) return;
            syncTripToServer('complete');
            setTimeout(() => {
                alert('Trip marked complete. It will now show up under Completed Trips on the main page.');
                location.reload();
            }, 600);
        }
    </script>
